name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DROPLET_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh ${DROPLET_USER}@${DROPLET_HOST} << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /home/jmx/jarvis
            
            # Pull latest changes
            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main
            
            # Make entrypoint executable
            chmod +x docker-entrypoint.sh
            
            # Stop containers gracefully
            echo "🛑 Stopping containers..."
            docker-compose down || true
            
            # Build new image (only once for all services)
            echo "🏗️ Building Docker images..."
            docker-compose build web
            
            # Start containers
            echo "🚢 Starting containers..."
            docker-compose up -d
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to be ready..."
            sleep 30
            
            # Wait for web service to be healthy
            echo "⏳ Waiting for web service to start..."
            for i in {1..30}; do
              if docker-compose ps web | grep -q "healthy"; then
                echo "✅ Web service is healthy"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            
            # Check container status
            echo "📊 Container status:"
            docker-compose ps
            
            # Clean up old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Health Check
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          echo "🏥 Running health check..."
          echo "⏳ Waiting for application to be fully ready..."
          sleep 20
          
          ssh ${DROPLET_USER}@${DROPLET_HOST} << 'ENDSSH'
            # Wait for application to respond
            for i in {1..20}; do
              if curl -f http://localhost:8080/admin/login/ > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/20: Application not ready yet, waiting..."
              sleep 3
            done
            
            # If we get here, health check failed
            echo "❌ Health check failed after 60 seconds"
            echo "Container status:"
            docker-compose ps
            echo "Recent logs:"
            docker-compose logs --tail=100 web
            exit 1
          ENDSSH

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment to jarvis.javohirmx.com completed successfully!"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs for details."
          exit 1

