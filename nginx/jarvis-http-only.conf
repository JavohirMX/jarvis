# Temporary HTTP-only Nginx configuration for jarvis.javohirmx.com
# Use this FIRST to obtain SSL certificate, then switch to jarvis.conf
# 
# Steps:
# 1. Copy this file to /etc/nginx/sites-available/jarvis
# 2. Get SSL certificate with Certbot
# 3. Replace with jarvis.conf (full SSL version)

# Upstream to Django/Daphne
upstream jarvis_backend {
    server localhost:8080;
}

# HTTP server (temporary - for certificate validation)
server {
    listen 80;
    listen [::]:80;
    server_name jarvis.javohirmx.com;

    # Max upload size
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/jarvis_access.log;
    error_log /var/log/nginx/jarvis_error.log;

    # Certbot validation (important!)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Serve static files directly
    location /static/ {
        alias /home/jmx/jarvis/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve media files directly
    location /media/ {
        alias /home/jmx/jarvis/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://jarvis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Django application
    location / {
        proxy_pass http://jarvis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

